<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">

</head>
<body>
    <header>
        <h1>Distribuidora Cambuí</h1>
        <img src="{{ url_for('static', filename='images/logo_dbcambui_2.png') }}" alt="Logo da Empresa">
    </header>

    <hr>

    <h1>Login</h1>
    
    <main>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="mensagens">
                {% for category, message in messages %}
                    <div class="alert {{ category }}">{{message}}</div>
                {% endfor %}
                </div>
            {% endif %}
        {% endwith %}


        <form action="/login" method="post" class="form-login">
        
            <!-- Grupo do campo: Nome -->
            <div class="form-group">
                <label for="nome_completo" class="form-label">Nome Completo</label>
                <input type="text" id="nome_completo" name="nome_completo" class="form-input" placeholder="Digite seu nome completo" required>
            </div>

            <!-- Grupo do campo: Senha -->
            <div class="form-group">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" id="senha" name="senha" class="form-input" placeholder="Digite sua senha" required>
            </div>

            <!-- Grupo dos Botões -->
            <div class="form-actions">
                <button type="reset" class="btn btn-secondary">Cancelar</button>
                <button type="submit" class="btn btn-primary">Entrar</button>
            </div>

        </form>

        
    </main>

</body>
</html>
