<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizar Trocas</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/visualizar_trocas.css') }}">
</head>
<body>
    <header>
        <h1>Visualizar Trocas</h1>
        <img src="{{ url_for('static', filename='images/logo_dbcambui_2.png') }}" alt="Logo da Empresa">
    </header>

    <hr>

    <form method="POST" action="{{ url_for('trocas.visualizar') }}">
    
        <div class="table-container">
            <table class="table" id="tabelaTrocas">
                <thead>
                    <tr>
                        <th>Id</th>
                        <th>Código Produto</th>
                        <th>Descrição</th>
                        <th>Quantidade</th>
                        <th>Situação</th>
                        <th></th>
                    </tr>
                </thead>

                <tbody>
                    {% if dados_trocas %}
                    {% for dado in dados_trocas %}
                    <tr>
                        <td>{{ dado.ids }}</td>
                        <td>{{ dado.codigo_produto }}</td>
                        <td>{{ dado.descricao }}</td>
                        <td>{{ dado.quantidade }}</td>
                        <td>{{ dado.situacao }}</td>
                        <td>
                            <button type="submit" name="concluir" value="{{ dado.codigo_produto }}" class="btn-confirmar">Concluir</button>
                        </td>
                    </tr>
                    {% endfor %}
                    {% endif %}
                </tbody>
            </table>
        </div>

    </form>

    
</body>
</html>
